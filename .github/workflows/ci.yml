name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck both workspaces
        run: npm run typecheck

      - name: Run test suite
        # The suite starts an ephemeral mongod via mongodb-memory-server.
        # No MONGODB_URI is needed and no secrets are configured.
        run: npm test

      - name: Build client
        run: npm run build --workspace client
